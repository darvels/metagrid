<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaGrid - Page not found</title>
  <meta name="description" content="The requested MetaGrid page could not be found. Return to the official MetaGrid landing page.">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/metagrid.ico" sizes="any">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <main id="top">
      <section class="hero section">
        <div class="hero__content">
          <p class="eyebrow">MetaGrid</p>
          <h1>Page not found</h1>
          <p class="hero__lede">
            The page you requested does not exist on the MetaGrid site. Head back to the landing page to download the app, review features, or open the GitHub repository.
          </p>
          <div class="hero__actions">
            <a class="button button--primary" href="./">Back to Homepage</a>
            <a class="button button--ghost" href="https://github.com/darvels/metagrid" target="_blank" rel="noopener noreferrer">Open GitHub</a>
          </div>
        </div>
        <div class="hero__visual">
          <div class="hero__visual-frame">
            <img src="assets/screenshots/app-hero-grid-en.png" alt="Real MetaGrid desktop app screenshot showing the current Hero Grid view." width="1280" height="820" decoding="async">
          </div>
          <div class="hero__caption">
            <span class="live-dot"></span>
            <span>Official MetaGrid landing page fallback</span>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
